
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonkeyType - Typing Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <div class="logo">⌨ monkeytype</div>
        <div>⚡ Typing Test</div>
    </header>

    <div class="settings">
        <div class="category">
            <button class="category-btn active" data-category="all">all</button>
            <button class="category-btn" data-category="work">work</button>
            <button class="category-btn" data-category="technology">technology</button>
            <button class="category-btn" data-category="programming">coding</button>
            <button class="category-btn" data-category="life">life</button>
            <button class="category-btn" data-category="business">business</button>
        </div>

        <div class="time-options">
            <button class="active" data-time="15">15</button>
            <button data-time="30">30</button>
            <button data-time="60">60</button>
            <button data-time="120">120</button>
        </div>
    </div>

    <div class="info">
        <div><h2 id="timer">15</h2><p>time</p></div>
        <div><h2 id="wpm">0</h2><p>wpm</p></div>
        <div><h2 id="accuracy">100%</h2><p>accuracy</p></div>
        <div><h2 id="characters">0</h2><p>characters</p></div>
    </div>

    <div class="typing-box" id="typingArea">
        <div id="textDisplay"></div>
        <textarea id="input" autofocus spellcheck="false"
        autocomplete="off" placeholder="Start typing here..."></textarea>
    </div>

    <div class="bottom">
        <button id="restart" class="restart">↻ Restart Test</button>
        <p>Tab + Enter to restart</p>
    </div>

    <div class="results-screen" id="resultsScreen">
        <h1>test completed<span>.</span></h1>
        <p class="result-subtitle">Here is your typing performance</p>

        <div class="main-result">
            <p>your speed</p>
            <h2 id="finalWpm">0</h2>
            <span>words per minute</span>
        </div>

        <div class="result-grid">
            <div class="result-card"><p>accuracy</p><h2 id="finalAccuracy">0%</h2></div>
            <div class="result-card"><p>characters</p><h2 id="finalCharacters">0</h2></div>
            <div class="result-card"><p>correct</p><h2 id="finalCorrect">0</h2></div>
            <div class="result-card"><p>incorrect</p><h2 id="finalIncorrect">0</h2></div>
            <div class="result-card"><p>time</p><h2 id="finalTime">15s</h2></div>
        </div>

        <button class="restart result-restart" id="tryAgain">↻ Try Again</button>
    </div>

    <footer>monkeytype — improve your typing speed</footer>

</div>

<script src="js.js"></script>
</body>
</html>
